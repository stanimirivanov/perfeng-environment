worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = / { try_files /index.html =404; }
        location = /index.html { try_files /index.html =404; }
        location = /search.js { try_files /search.js =404; }
        location = /healthz { default_type text/plain; return 200 "ready\n"; }
        location / { return 404; }
    }
}
