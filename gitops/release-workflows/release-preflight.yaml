apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: perfeng-release-preflight-v1
  namespace: argo-workflows
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
spec:
  serviceAccountName: release-preflight
  entrypoint: preflight
  activeDeadlineSeconds: 600
  arguments:
    parameters:
      - name: request-revision
        description: Full Git commit containing the reviewed request file, separate from selection.revision.
      - name: request-path
        description: Repository-relative deployments/release-requests/<name>.json path.
      - name: request-sha256
        description: SHA-256 of the exact UTF-8 request bytes, including final newline.
      - name: selection-revision
        description: Full Git commit selected by the release request.
  templates:
    - name: preflight
      steps:
        - - name: validate-schema
            template: validate-schema
        - - name: cluster-uid
            template: cluster-uid
        - - name: verify-identities
            template: verify-identities
            arguments:
              parameters:
                - name: observed-cluster-uid
                  value: "{{steps.cluster-uid.outputs.parameters.uid}}"
      outputs:
        parameters:
          - name: result
            valueFrom:
              parameter: "{{steps.verify-identities.outputs.parameters.result}}"
    - name: validate-schema
      inputs:
        artifacts:
          - name: request-source
            path: /inputs/request
            git:
              repo: https://github.com/stanimirivanov/perfeng-environment.git
              revision: "{{workflow.parameters.request-revision}}"
              disableSubmodules: true
              usernameSecret:
                name: release-git-read
                key: username
              passwordSecret:
                name: release-git-read
                key: password
      container:
        image: ghcr.io/sourcemeta/jsonschema:v17.2.0@sha256:8466fb557d241ec0a8e5b20056bafc0e6d23affc72bb223402dc9657bfb8f40d
        command: [/bin/sh, -ec]
        env:
          - name: REQUEST_PATH
            value: "{{workflow.parameters.request-path}}"
        args:
          - |
            case "$REQUEST_PATH" in
              deployments/release-requests/*.json) ;;
              *) echo 'Invalid request path' >&2; exit 2 ;;
            esac
            case "${REQUEST_PATH#deployments/release-requests/}" in
              *[!a-zA-Z0-9._-]*|.*|*..*|*/*) echo 'Invalid request name' >&2; exit 2 ;;
            esac
            printf '%s  %s\n' \
              'e9166c6eb2bd2d2468ec8af2286ae61ae6d3db6987b26075d1955821da11385d' \
              /inputs/request/deployments/release-request-v1.schema.json | sha256sum -c - >/dev/null
            /usr/local/bin/jsonschema validate \
              /inputs/request/deployments/release-request-v1.schema.json \
              "/inputs/request/$REQUEST_PATH"
    - name: cluster-uid
      resource:
        action: get
        manifest: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: kube-system
      outputs:
        parameters:
          - name: uid
            valueFrom:
              jsonPath: '{.metadata.uid}'
    - name: verify-identities
      inputs:
        parameters:
          - name: observed-cluster-uid
        artifacts:
          - name: request-source
            path: /inputs/request
            git:
              repo: https://github.com/stanimirivanov/perfeng-environment.git
              revision: "{{workflow.parameters.request-revision}}"
              disableSubmodules: true
              usernameSecret:
                name: release-git-read
                key: username
              passwordSecret:
                name: release-git-read
                key: password
          - name: selected-source
            path: /inputs/selection
            git:
              repo: https://github.com/stanimirivanov/perfeng-environment.git
              revision: "{{workflow.parameters.selection-revision}}"
              disableSubmodules: true
              usernameSecret:
                name: release-git-read
                key: username
              passwordSecret:
                name: release-git-read
                key: password
      outputs:
        parameters:
          - name: result
            valueFrom:
              path: /tmp/preflight-result.json
      script:
        image: python:3.13.9-slim-trixie@sha256:326df678c20c78d465db501563f3492d17c42a4afe33a1f2bf5406a1d56b0e86
        command: [python]
        env:
          - name: REQUEST_REVISION
            value: "{{workflow.parameters.request-revision}}"
          - name: REQUEST_PATH
            value: "{{workflow.parameters.request-path}}"
          - name: REQUEST_SHA256
            value: "{{workflow.parameters.request-sha256}}"
          - name: SELECTION_REVISION
            value: "{{workflow.parameters.selection-revision}}"
          - name: OBSERVED_CLUSTER_UID
            value: "{{inputs.parameters.observed-cluster-uid}}"
        source: |
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def fail(message):
              print(f"Preflight refused: {message}", file=sys.stderr)
              raise SystemExit(2)

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail("duplicate JSON key")
                  result[key] = value
              return result

          def commit(root, expected):
              if not re.fullmatch(r"[0-9a-f]{40}", expected):
                  fail("revision must be a full Git commit")
              try:
                  head = (root / ".git/HEAD").read_text(encoding="ascii").strip()
              except (OSError, UnicodeError):
                  fail("Git artifact checkout metadata is unavailable")
              if head != expected:
                  fail("Git artifact checkout does not match the requested commit")

          def checked_bytes(root, relative, limit):
              path = root / relative
              if path.is_symlink() or not path.resolve().is_relative_to(root.resolve()):
                  fail("Git artifact path escapes its checkout")
              try:
                  if path.stat().st_size > limit:
                      fail("Git artifact exceeds the preflight size limit")
                  return path.read_bytes()
              except OSError:
                  fail("Git artifact is unavailable")

          request_root = Path(os.environ.get("REQUEST_ROOT", "/inputs/request"))
          selection_root = Path(os.environ.get("SELECTION_ROOT", "/inputs/selection"))
          request_revision = os.environ["REQUEST_REVISION"]
          selection_revision = os.environ["SELECTION_REVISION"]
          commit(request_root, request_revision)
          commit(selection_root, selection_revision)
          path = os.environ["REQUEST_PATH"]
          if not re.fullmatch(r"deployments/release-requests/[A-Za-z0-9][A-Za-z0-9._-]{0,63}\.json", path):
              fail("request path is outside the reviewed request directory")
          raw = checked_bytes(request_root, path, 65536)
          digest = "sha256:" + hashlib.sha256(raw).hexdigest()
          if digest != os.environ["REQUEST_SHA256"]:
              fail("request bytes differ from the submitted digest")
          try:
              request = json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
          except (UnicodeError, ValueError):
              fail("request is not valid unique-key UTF-8 JSON")
          if request["selection"]["repository"] != "https://github.com/stanimirivanov/perfeng-environment.git":
              fail("request repository differs from the reviewed origin")
          if request["selection"]["revision"] != selection_revision:
              fail("selected Git revision differs from the request")
          observed_uid = os.environ["OBSERVED_CLUSTER_UID"]
          if request["environment"]["clusterUID"] != observed_uid:
              fail("target cluster UID differs from the request")
          lock_digests = request["selection"]["lockDigests"]
          for lock_path, expected in lock_digests.items():
              if not re.fullmatch(r"deployments/[a-z][a-z0-9-]{0,62}\.json", lock_path):
                  fail("invalid deployment lock path")
              actual = "sha256:" + hashlib.sha256(checked_bytes(selection_root, lock_path, 1048576)).hexdigest()
              if actual != expected:
                  fail(f"deployment lock digest mismatch: {lock_path}")
          result = {
              "schemaVersion": 1,
              "kind": "PerfengReleasePreflight",
              "requestDigest": digest,
              "requestRevision": request_revision,
              "requestPath": path,
              "selectionRevision": selection_revision,
              "environment": request["environment"]["name"],
              "clusterUID": observed_uid,
              "lockDigests": lock_digests,
              "status": "identity-verified",
          }
          Path(os.environ.get("RESULT_PATH", "/tmp/preflight-result.json")).write_text(
              json.dumps(result, sort_keys=True, separators=(",", ":")), encoding="utf-8"
          )
          print(f"Preflight identity verified for {result['environment']} at {digest}")
