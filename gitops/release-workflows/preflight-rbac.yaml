apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-preflight
  namespace: argo-workflows
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-preflight
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [release-git-read]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-preflight
  namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-preflight
subjects:
  - kind: ServiceAccount
    name: release-preflight
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: perfeng-release-preflight-kube-system
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perfeng-release-preflight-kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: perfeng-release-preflight-kube-system
subjects:
  - kind: ServiceAccount
    name: release-preflight
    namespace: argo-workflows
