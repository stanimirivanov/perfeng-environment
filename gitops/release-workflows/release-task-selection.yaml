apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: perfeng-release-task-selection-v1
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
spec:
  templates:
    - name: run
      inputs:
        parameters:
          - name: preflight-result
          - name: expected-environment
          - name: expected-lock-path
          - name: expected-lock-digest
      script:
        image: python:3.13.9-slim-trixie@sha256:326df678c20c78d465db501563f3492d17c42a4afe33a1f2bf5406a1d56b0e86
        command: [python]
        env:
          - name: PREFLIGHT_RESULT
            value: "{{inputs.parameters.preflight-result}}"
          - name: EXPECTED_ENVIRONMENT
            value: "{{inputs.parameters.expected-environment}}"
          - name: EXPECTED_LOCK_PATH
            value: "{{inputs.parameters.expected-lock-path}}"
          - name: EXPECTED_LOCK_DIGEST
            value: "{{inputs.parameters.expected-lock-digest}}"
        source: |
          import json
          import os

          result = json.loads(os.environ["PREFLIGHT_RESULT"])
          if result["environment"] != os.environ["EXPECTED_ENVIRONMENT"] or result["lockDigests"].get(
              os.environ["EXPECTED_LOCK_PATH"]
          ) != os.environ["EXPECTED_LOCK_DIGEST"]:
              raise SystemExit("External-state v1 does not match the reviewed control-plane selection")
