apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac/preflight/serviceaccount.yaml
  - rbac/preflight/workflow-access.yaml
  - rbac/preflight/cluster-identity.yaml
  - release-preflight-v3.yaml
  - rbac/external-state/serviceaccount.yaml
  - rbac/external-state/workflow-access.yaml
  - rbac/external-state/cluster-identity.yaml
  - rbac/external-state/platform-jobs.yaml
  - rbac/external-state/generator-jobs.yaml
  - release-task-selection-v3.yaml
  - prepare-bucket.yaml
  - prepare-database-roles.yaml
  - prepare-execution-registry.yaml
  - release-external-state.yaml
  - rbac/readiness/serviceaccount.yaml
  - rbac/readiness/workflow-access.yaml
  - rbac/readiness/cluster-identity.yaml
  - rbac/readiness/platform-observation.yaml
  - observe-release-readiness.yaml
  - verify-release-readiness-v3.yaml
  - release-readiness-v3.yaml
  - rbac/maintenance/serviceaccount.yaml
  - rbac/maintenance/workflow-access.yaml
  - rbac/maintenance/cluster-identity.yaml
  - rbac/maintenance/platform-observation.yaml
  - verify-release-quiescence-v3.yaml
  - release-maintenance-checkpoint-v3.yaml
  - rbac/adoption/serviceaccount.yaml
  - rbac/adoption/workflow-access.yaml
  - rbac/adoption/cluster-identity.yaml
  - rbac/adoption/platform-observation.yaml
  - plan-release-adoption-v3.yaml
  - adoption-records.yaml
  - release-adopt-existing-v3.yaml
  - rbac/maintenance-pause/serviceaccount.yaml
  - rbac/maintenance-pause/workflow-access.yaml
  - rbac/maintenance-pause/cluster-identity.yaml
  - rbac/maintenance-pause/platform-access.yaml
  - maintenance-resources-v1.yaml
  - release-maintenance-pause-v1.yaml
  - rbac/schema-migration/serviceaccount.yaml
  - rbac/schema-migration/workflow-access.yaml
  - rbac/schema-migration/cluster-identity.yaml
  - rbac/schema-migration/platform-observation.yaml
  - schema-migration-intent-v1.yaml
  - schema-migration-job-v1.yaml
  - release-schema-migration-v1.yaml
  - release-schema-migration-v2.yaml
  - rbac/runtime-grants/serviceaccount.yaml
  - rbac/runtime-grants/workflow-access.yaml
  - rbac/runtime-grants/cluster-identity.yaml
  - rbac/runtime-grants/platform-observation.yaml
  - runtime-grants-sql-v1.yaml
  - runtime-grants-job-v1.yaml
  - release-runtime-grants-v1.yaml
  - release-runtime-grants-v2.yaml
configMapGenerator:
  - name: perfeng-external-state-scripts-v1
    namespace: perf-platform
    files:
      - scripts/bucket.sh
      - scripts/database-roles.sh
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
  - name: perfeng-release-verifiers-v3
    namespace: argo-workflows
    files:
      - verifiers-v3/release_policy_v3.py
      - verifiers-v3/release_runtime_v3.py
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
patches:
  - target:
      kind: ConfigMap
      name: perfeng-external-state-scripts-v1
    patch: |-
      - op: add
        path: /immutable
        value: true
  - target:
      kind: ConfigMap
      name: perfeng-release-verifiers-v3
    patch: |-
      - op: add
        path: /immutable
        value: true
