apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: perfeng-release-schema-migration-v2
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
spec:
  serviceAccountName: release-schema-migration
  entrypoint: migrate
  activeDeadlineSeconds: 1800
  synchronization:
    mutexes:
    - name: perfeng-local-external-state
  arguments:
    parameters:
    - name: request-revision
    - name: request-path
    - name: request-sha256
    - name: selection-revision
  templates:
  - name: migrate
    steps:
    - - name: preflight
        templateRef:
          name: perfeng-release-preflight-v3
          template: preflight
    - - name: task-selection
        templateRef:
          name: perfeng-release-task-selection-v3
          template: run
        arguments:
          parameters:
          - name: preflight-result
            value: '{{steps.preflight.outputs.parameters.result}}'
          - name: expected-environment
            value: perfeng-local
          - name: expected-lock-path
            value: deployments/local-control-plane.json
          - name: expected-lock-digest
            value: sha256:a0d206a41e14c06d2d019dbb0dda7c50e07f93a72d52e0cd6a0b76e7ec9601ec
    - - name: migration-intent
        templateRef:
          name: perfeng-release-schema-migration-v1
          template: migration-intent
    - - name: candidate
        template: candidate
    - - name: pointer
        template: pointer
        arguments:
          parameters:
          - name: request
            value: '{{steps.candidate.outputs.parameters.request}}'
    - - name: receipt
        template: receipt
        arguments:
          parameters:
          - name: request
            value: '{{steps.candidate.outputs.parameters.request}}'
          - name: pointer
            value: '{{steps.pointer.outputs.parameters.observation}}'
    - - name: accepted-bytes
        template: accepted-bytes
        arguments:
          parameters:
          - name: request
            value: '{{steps.candidate.outputs.parameters.request}}'
          - name: receipt
            value: '{{steps.receipt.outputs.parameters.observation}}'
    - - name: quiescence
        templateRef:
          name: perfeng-verify-release-quiescence-v3
          template: run
        arguments:
          parameters:
          - name: preflight-result
            value: '{{steps.preflight.outputs.parameters.result}}'
    - - name: receipt-stable
        template: receipt-stable
        arguments:
          parameters:
          - name: pointer
            value: '{{steps.pointer.outputs.parameters.observation}}'
          - name: receipt
            value: '{{steps.receipt.outputs.parameters.observation}}'
    - - name: admission
        template: admission
        arguments:
          parameters:
          - name: request
            value: '{{steps.candidate.outputs.parameters.request}}'
          - name: pointer
            value: '{{steps.pointer.outputs.parameters.observation}}'
          - name: receipt
            value: '{{steps.receipt.outputs.parameters.observation}}'
          - name: checkpoint
            value: '{{steps.quiescence.outputs.parameters.result}}'
    - - name: migrate
        templateRef:
          name: perfeng-schema-migration-job-v1
          template: run
    outputs:
      parameters:
      - name: checkpoint
        valueFrom:
          parameter: '{{steps.quiescence.outputs.parameters.result}}'
      - name: job-name
        valueFrom:
          parameter: '{{steps.migrate.outputs.parameters.job-name}}'
  - name: candidate
    activeDeadlineSeconds: 60
    inputs:
      artifacts:
      - name: request-source
        path: /inputs/request
        git:
          repo: https://github.com/stanimirivanov/perfeng-environment.git
          revision: '{{workflow.parameters.request-revision}}'
          disableSubmodules: true
          usernameSecret:
            name: release-git-read
            key: username
          passwordSecret:
            name: release-git-read
            key: password
    volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 1Mi
    container:
      image: ghcr.io/sourcemeta/jsonschema:v17.2.0@sha256:8466fb557d241ec0a8e5b20056bafc0e6d23affc72bb223402dc9657bfb8f40d
      command:
      - /bin/sh
      - -ec
      env:
      - name: REQUEST_PATH
        value: '{{workflow.parameters.request-path}}'
      - name: REQUEST_SHA256
        value: '{{workflow.parameters.request-sha256}}'
      - name: REQUEST_ROOT
        value: /inputs/request
      args:
      - |
        printf '%s  %s\n' "${REQUEST_SHA256#sha256:}" "$REQUEST_ROOT/$REQUEST_PATH" | sha256sum -c - >/dev/null

        cat > /tmp/current.schema.json <<'SCHEMA'
        {"type":"object","required":["promotion"],"properties":{"promotion":{"type":"object","required":["expectedCurrent"],"properties":{"expectedCurrent":{"type":"string","minLength":71,"maxLength":71,"pattern":"^sha256:[0-9a-f]{64}$"}}}}}
        SCHEMA
        /usr/local/bin/jsonschema validate /tmp/current.schema.json "$REQUEST_ROOT/$REQUEST_PATH" >/dev/null 2>&1
        cp "$REQUEST_ROOT/$REQUEST_PATH" /tmp/request.json
      volumeMounts:
      - name: scratch
        mountPath: /tmp
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
    podSpecPatch: '{"securityContext":{"fsGroup":10001,"fsGroupChangePolicy":"OnRootMismatch"}}'
    outputs:
      parameters:
      - name: request
        valueFrom:
          path: /tmp/request.json
  - name: pointer
    activeDeadlineSeconds: 60
    inputs:
      parameters:
      - name: request
    resource:
      action: get
      flags:
      - --request-timeout=10s
      manifest: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: perfeng-local-current
          namespace: perfeng-release-ledger
    outputs:
      parameters:
      - name: observation
        valueFrom:
          jqFilter: |
            def nonempty: type == "string" and length > 0;
            def owned($name; $purpose):
              .apiVersion == "v1" and .kind == "ConfigMap"
              and .metadata.name == $name and .metadata.namespace == "perfeng-release-ledger"
              and (.metadata.uid | nonempty) and (.metadata.resourceVersion | nonempty)
              and .metadata.labels == {"app.kubernetes.io/managed-by":"perfeng-environment","perfeng.io/purpose":$purpose}
              and (.metadata.ownerReferences // [] | length) == 0
              and (.metadata.finalizers // [] | length) == 0
              and (.metadata.deletionTimestamp // null) == null
              and (.metadata.annotations["argocd.argoproj.io/tracking-id"] // null) == null;
            ({{=toJson(inputs.parameters.request)}} | fromjson) as $request |
            if owned("perfeng-local-current"; "current-release")
            and (.immutable // false) == false and (.binaryData // {} | length) == 0
            and (.data | keys) == ["clusterUID","receiptName","receiptUID","requestDigest"]
            and ($request.promotion.expectedCurrent | type == "string" and length == 71 and test("^sha256:[0-9a-f]{64}$"))
            and .data.requestDigest == $request.promotion.expectedCurrent
            and .data.clusterUID == $request.environment.clusterUID
            and .data.receiptName == ("receipt." + .data.requestDigest[7:39] + "." + .data.requestDigest[39:])
            and (.data.receiptUID | nonempty)
            then . else error("retained-baseline admission refused: current pointer") end
  - name: receipt
    activeDeadlineSeconds: 60
    inputs:
      parameters:
      - name: request
      - name: pointer
    resource:
      action: get
      flags:
      - --request-timeout=10s
      manifest: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '{{=jsonpath(inputs.parameters.pointer, '$.data.receiptName')}}'
          namespace: perfeng-release-ledger
    outputs:
      parameters:
      - name: observation
        valueFrom:
          jqFilter: |
            def nonempty: type == "string" and length > 0;
            def owned($name; $purpose):
              .apiVersion == "v1" and .kind == "ConfigMap"
              and .metadata.name == $name and .metadata.namespace == "perfeng-release-ledger"
              and (.metadata.uid | nonempty) and (.metadata.resourceVersion | nonempty)
              and .metadata.labels == {"app.kubernetes.io/managed-by":"perfeng-environment","perfeng.io/purpose":$purpose}
              and (.metadata.ownerReferences // [] | length) == 0
              and (.metadata.finalizers // [] | length) == 0
              and (.metadata.deletionTimestamp // null) == null
              and (.metadata.annotations["argocd.argoproj.io/tracking-id"] // null) == null;
            ({{=toJson(inputs.parameters.request)}} | fromjson) as $request | ({{=toJson(inputs.parameters.pointer)}} | fromjson) as $pointer |
            . as $receipt |
            (.binaryData["request.json"] | @base64d) as $raw |
            (.binaryData["receipt.json"] | @base64d) as $recordRaw |
            ($raw | fromjson) as $accepted | ($recordRaw | fromjson) as $record |
            if owned($pointer.data.receiptName; "release-adoption")
            and .metadata.uid == $pointer.data.receiptUID and .immutable == true
            and (.data // {} | length) == 0 and (.binaryData | keys) == ["receipt.json","request.json"]
            and ($raw | @base64) == .binaryData["request.json"]
            and ($recordRaw | @base64) == .binaryData["receipt.json"]
            and ($raw | utf8bytelength) > 0 and ($raw | utf8bytelength) <= 65536
            and ($recordRaw | utf8bytelength) <= 65536
            and (.metadata.annotations["perfeng.io/first-workflow-uid"] | type == "string" and length == 36 and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))
            and (.metadata.annotations["perfeng.io/first-request-revision"] | type == "string" and length == 40 and test("^[0-9a-f]{40}$"))
            and ($accepted | del(.promotion)) == ($request | del(.promotion))
            and ($accepted.promotion | keys) == ["activation","expectedCurrent","migration"]
            and $accepted.promotion.expectedCurrent == null and $accepted.promotion.activation == "manual"
            and ($accepted.promotion.migration == {mode:"none"} or $accepted.promotion.migration == {mode:"forward-only",id:"0018"})
            and ($record | keys) == ["controlPlaneApplicationUID","deploymentRevision","environment","image","kind","requestDigest","rootUID","schemaVersion","selectionRevision","status"]
            and $record.schemaVersion == 1 and $record.kind == "PerfengReleaseAdoptionReceipt"
            and $record.status == "adopted-baseline" and $record.requestDigest == $request.promotion.expectedCurrent
            and $record.environment == $request.environment and $record.selectionRevision == $request.selection.revision
            and ($record.rootUID | nonempty) and ($record.controlPlaneApplicationUID | nonempty)
            and $record.deploymentRevision == "4c762262422420a1a223e1d56c2c469ab1c38c89"
            and $record.image == "ghcr.io/stanimirivanov/perfeng-control-plane@sha256:e251a378be0915c68f30c7c1e5fa523ecd6d3efaae996b430933718c19e9c3b3"
            then . else error("retained-baseline admission refused: immutable receipt") end
  - name: receipt-stable
    activeDeadlineSeconds: 60
    inputs:
      parameters:
      - name: pointer
      - name: receipt
    resource:
      action: get
      flags:
      - --request-timeout=10s
      manifest: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: '{{=jsonpath(inputs.parameters.pointer, '$.data.receiptName')}}'
          namespace: perfeng-release-ledger
    outputs:
      parameters:
      - name: observation
        valueFrom:
          jqFilter: |
            ({{=toJson(inputs.parameters.receipt)}} | fromjson) as $receipt |
            if (del(.metadata.resourceVersion,.metadata.managedFields)) == ($receipt | del(.metadata.resourceVersion,.metadata.managedFields))
            then . else error("retained-baseline admission refused: receipt changed") end
  - name: accepted-bytes
    activeDeadlineSeconds: 60
    inputs:
      parameters:
      - name: request
      - name: receipt
    volumes:
    - name: scratch
      emptyDir:
        sizeLimit: 1Mi
    podSpecPatch: '{"securityContext":{"fsGroup":10001,"fsGroupChangePolicy":"OnRootMismatch"}}'
    container:
      image: ghcr.io/sourcemeta/jsonschema:v17.2.0@sha256:8466fb557d241ec0a8e5b20056bafc0e6d23affc72bb223402dc9657bfb8f40d
      command:
      - /bin/sh
      - -ec
      args:
      - |
        umask 077
        trap 'printf "%s\n" "[RELEASE_ADMISSION] Accepted request byte verification failed" >&2' EXIT
        printf '%s' "$ACCEPTED_B64" | base64 --decode > /tmp/accepted.json
        printf '%s  %s\n' "${EXPECTED_CURRENT#sha256:}" /tmp/accepted.json | sha256sum -c - >/dev/null 2>&1
        trap - EXIT
      env:
      - name: ACCEPTED_B64
        value: '{{=jsonpath(inputs.parameters.receipt, ''$.binaryData["request.json"]'')}}'
      - name: EXPECTED_CURRENT
        value: '{{=jsonpath(inputs.parameters.request, ''$.promotion.expectedCurrent'')}}'
      volumeMounts:
      - name: scratch
        mountPath: /tmp
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
          - ALL
        seccompProfile:
          type: RuntimeDefault
  - name: admission
    activeDeadlineSeconds: 60
    inputs:
      parameters:
      - name: request
      - name: pointer
      - name: receipt
      - name: checkpoint
    resource:
      action: get
      flags:
      - --request-timeout=10s
      manifest: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: perfeng-local-current
          namespace: perfeng-release-ledger
    outputs:
      parameters:
      - name: observation
        valueFrom:
          jqFilter: |
            def nonempty: type == "string" and length > 0;
            def owned($name; $purpose):
              .apiVersion == "v1" and .kind == "ConfigMap"
              and .metadata.name == $name and .metadata.namespace == "perfeng-release-ledger"
              and (.metadata.uid | nonempty) and (.metadata.resourceVersion | nonempty)
              and .metadata.labels == {"app.kubernetes.io/managed-by":"perfeng-environment","perfeng.io/purpose":$purpose}
              and (.metadata.ownerReferences // [] | length) == 0
              and (.metadata.finalizers // [] | length) == 0
              and (.metadata.deletionTimestamp // null) == null
              and (.metadata.annotations["argocd.argoproj.io/tracking-id"] // null) == null;
            ({{=toJson(inputs.parameters.request)}} | fromjson) as $request | ({{=toJson(inputs.parameters.pointer)}} | fromjson) as $pointer | ({{=toJson(inputs.parameters.receipt)}} | fromjson) as $receipt | ({{=toJson(inputs.parameters.checkpoint)}} | fromjson) as $checkpoint |
            ($receipt.binaryData["receipt.json"] | @base64d | fromjson) as $record |
            if owned("perfeng-local-current"; "current-release")
            and .metadata.uid == $pointer.metadata.uid and .data == $pointer.data
            and (.immutable // false) == false and (.binaryData // {} | length) == 0
            and $checkpoint.schemaVersion == 1 and $checkpoint.kind == "PerfengMaintenanceCheckpoint"
            and $checkpoint.status == "quiescence-observed" and $checkpoint.environment == "perfeng-local"
            and $checkpoint.requestDigest == "{{workflow.parameters.request-sha256}}"
            and $checkpoint.requestRevision == "{{workflow.parameters.request-revision}}"
            and $checkpoint.clusterUID == $request.environment.clusterUID
            and $checkpoint.selectionRevision == $request.selection.revision
            and ($checkpoint.resources | length) == 3
            and $checkpoint.resources[0].name == "perfeng-local-root" and $checkpoint.resources[0].uid == $record.rootUID
            and $checkpoint.resources[1].name == "perfeng-local-control-plane" and $checkpoint.resources[1].uid == $record.controlPlaneApplicationUID
            then {status:"retained-baseline-verified"}
            else error("retained-baseline admission refused: fresh identity binding") end
