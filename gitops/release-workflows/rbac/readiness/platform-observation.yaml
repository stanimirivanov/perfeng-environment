apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-readiness
  namespace: perf-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - control-plane
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - statefulsets
    resourceNames:
      - postgres
      - seaweedfs
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - services
    resourceNames:
      - control-plane
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-readiness
  namespace: perf-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-readiness
subjects:
  - kind: ServiceAccount
    name: release-readiness
    namespace: argo-workflows
