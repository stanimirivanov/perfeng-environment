apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-runtime-grants
  namespace: perf-platform
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - control-plane
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-runtime-grants
  namespace: perf-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-runtime-grants
subjects:
- kind: ServiceAccount
  name: release-runtime-grants
  namespace: argo-workflows
