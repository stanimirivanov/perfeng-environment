apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-runtime-grants
  namespace: argo-workflows
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - release-git-read
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-runtime-grants
  namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-runtime-grants
subjects:
  - kind: ServiceAccount
    name: release-runtime-grants
    namespace: argo-workflows
