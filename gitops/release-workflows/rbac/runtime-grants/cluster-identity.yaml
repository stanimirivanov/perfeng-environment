apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: perfeng-release-runtime-grants-kube-system
rules:
  - apiGroups:
      - ''
    resources:
      - namespaces
    resourceNames:
      - kube-system
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perfeng-release-runtime-grants-kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: perfeng-release-runtime-grants-kube-system
subjects:
  - kind: ServiceAccount
    name: release-runtime-grants
    namespace: argo-workflows
