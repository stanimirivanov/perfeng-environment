apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-maintenance-pause
  namespace: perf-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
    resourceNames:
      - control-plane
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
    resourceNames:
      - postgres
      - seaweedfs
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - get
    resourceNames:
      - control-plane
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-maintenance-pause
  namespace: perf-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-maintenance-pause
subjects:
  - kind: ServiceAccount
    name: release-maintenance-pause
    namespace: argo-workflows
