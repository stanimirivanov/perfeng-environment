apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-maintenance-checkpoint
  namespace: perf-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - control-plane
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-maintenance-checkpoint
  namespace: perf-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-maintenance-checkpoint
subjects:
  - kind: ServiceAccount
    name: release-maintenance-checkpoint
    namespace: argo-workflows
