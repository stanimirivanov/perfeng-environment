apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-external-state
  namespace: argo-workflows
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-external-state
  namespace: argo-workflows
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [release-git-read]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-external-state
  namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-external-state
subjects:
  - kind: ServiceAccount
    name: release-external-state
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: perfeng-release-external-state-kube-system
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: perfeng-release-external-state-kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: perfeng-release-external-state-kube-system
subjects:
  - kind: ServiceAccount
    name: release-external-state
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-external-state-jobs
  namespace: perf-platform
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-external-state-jobs
  namespace: perf-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-external-state-jobs
subjects:
  - kind: ServiceAccount
    name: release-external-state
    namespace: argo-workflows
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-external-state-jobs
  namespace: perf-generators
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-external-state-jobs
  namespace: perf-generators
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-external-state-jobs
subjects:
  - kind: ServiceAccount
    name: release-external-state
    namespace: argo-workflows
