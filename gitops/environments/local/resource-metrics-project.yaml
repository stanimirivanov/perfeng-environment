apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: perfeng-local-resource-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
    perfeng.io/environment: local
spec:
  description: Verified-TLS local resource metrics; separate from Perfeng workload authority
  sourceRepos:
    - https://github.com/stanimirivanov/k8s-infrastructure.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiregistration.k8s.io
      kind: APIService
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
