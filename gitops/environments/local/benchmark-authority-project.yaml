apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: perfeng-local-benchmark-authority
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
    perfeng.io/environment: local
spec:
  description: Dedicated disposable kind benchmark controller authority; never shared or cloud
  sourceRepos:
    - https://github.com/stanimirivanov/perfeng-environment.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: perf-generators
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
