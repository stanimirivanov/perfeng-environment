apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: perfeng-local-resource-metrics
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
    perfeng.io/environment: local
    perfeng.io/workload: resource-metrics
spec:
  project: perfeng-local-resource-metrics
  source:
    repoURL: https://github.com/stanimirivanov/k8s-infrastructure.git
    targetRevision: 5970bffa1f3d200e73d5a55e0cd4ef34ed9ef3b7
    path: charts/resource-metrics
    helm:
      releaseName: resource-metrics
      valuesObject:
        tls:
          secretName: substrate-resource-metrics-tls
          caBundle: 
        nodeSelector:
          kubernetes.io/os: linux
          workload: control-plane
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
