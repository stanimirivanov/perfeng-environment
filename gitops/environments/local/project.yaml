apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: perfeng-local
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
    perfeng.io/environment: local
spec:
  description: Local performance-platform GitOps applications
  sourceRepos:
    - https://github.com/stanimirivanov/perfeng-environment.git
    - https://github.com/stanimirivanov/perfeng-k8s.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: perf-generators
    - server: https://kubernetes.default.svc
      namespace: perf-platform
    - server: https://kubernetes.default.svc
      namespace: perf-sut
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
