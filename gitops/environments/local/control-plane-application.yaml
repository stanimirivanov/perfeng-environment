apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: perfeng-local-control-plane
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: perfeng-environment
    perfeng.io/environment: local
    perfeng.io/workload: control-plane
spec:
  project: perfeng-local
  source:
    repoURL: https://github.com/stanimirivanov/perfeng-k8s.git
    targetRevision: fa718c2b62f4f10b5e9da8dce7b00a3f51daae0b
    path: charts/control-plane
    helm:
      releaseName: control-plane
      valuesObject:
        image: ghcr.io/stanimirivanov/perfeng-control-plane@sha256:e251a378be0915c68f30c7c1e5fa523ecd6d3efaae996b430933718c19e9c3b3
        imagePullSecret: perfeng-control-plane-registry
        executionNamespace: perf-generators
        httpPort: 8080
        runtimeConfigMap: perfeng-control-plane-runtime-315a2eede8ff
        runtimeSecret: perfeng-control-plane-runtime
        authenticationSecret: perfeng-control-plane-authentication
        registryConfigMap: perfeng-runtime-registry-7be1d749994e
        registryItems:
          - key: identities--environment.json
            path: identities/environment.json
          - key: jobs--analysis.yaml
            path: jobs/analysis.yaml
          - key: jobs--benchmark.json
            path: jobs/benchmark.json
          - key: jobs--checkout.json
            path: jobs/checkout.json
          - key: jobs--reporting.yaml
            path: jobs/reporting.yaml
          - key: policies--checkout-smoke.json
            path: policies/checkout-smoke.json
          - key: policies--pod-startup.json
            path: policies/pod-startup.json
          - key: registry.json
            path: registry.json
  destination:
    server: https://kubernetes.default.svc
    namespace: perf-platform
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
