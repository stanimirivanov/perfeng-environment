apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-adoption
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - perfeng-local-root
      - perfeng-local-control-plane
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-adoption
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-adoption
subjects:
  - kind: ServiceAccount
    name: release-adoption
    namespace: argo-workflows
