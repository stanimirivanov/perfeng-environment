apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-schema-migration
  namespace: perfeng-release-ledger
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: release-schema-migration
  namespace: perfeng-release-ledger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-schema-migration
subjects:
  - kind: ServiceAccount
    name: release-schema-migration
    namespace: argo-workflows
