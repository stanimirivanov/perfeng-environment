version: "3"

tasks:
  default:
    desc: List the supported local operator tasks
    silent: true
    cmds:
      - task --list

  bootstrap:
    desc: Bootstrap the local cluster and stateful GitOps foundation
    summary: |
      Use the immutable infrastructure selection to create or validate the named
      kind cluster and install Argo CD. Then establish Perfeng external
      credential identities, reconcile the stateful Applications, and initialize
      the local S3 bucket. This stops before reviewed policy publication and
      control-plane database/runtime preparation.
    cmds:
      - uv run --locked python scripts/infrastructure_runtime.py cluster ensure --execute
      - uv run --locked python scripts/cluster.py bootstrap --execute
      - uv run --locked python scripts/postgres.py bootstrap --execute
      - uv run --locked python scripts/object_store.py bootstrap --execute
      - uv run --locked python scripts/control_plane_registry.py deploy --execute
      - uv run --locked python scripts/infrastructure_runtime.py argocd bootstrap --execute
      - uv run --locked python scripts/gitops.py bootstrap --execute
      - uv run --locked python scripts/object_store.py initialize --execute
      - uv run --locked python scripts/storage_access.py --execute

  status:
    desc: Validate the complete local platform without reconciling desired state
    cmds:
      - uv run --locked python scripts/workspace.py status
      - uv run --locked python scripts/infrastructure_runtime.py cluster health --execute
      - uv run --locked python scripts/infrastructure_runtime.py argocd health --execute
      - uv run --locked python scripts/gitops.py health --execute

  smoke:
    desc: Validate platform health and run one retained end-to-end smoke Run
    cmds:
      - task: status
      - uv run --locked python scripts/control_plane_smoke.py --execute

  destroy:
    desc: Permanently delete the named local cluster and all cluster-local data
    prompt: This permanently deletes perfeng-local and all cluster-local data. Continue?
    cmds:
      - uv run --locked python scripts/infrastructure_runtime.py cluster down --execute --confirm-delete perfeng-local

  native:api:
    desc: Forward the reviewed control-plane Service to loopback for at most one hour
    cmds:
      - uv run --locked python scripts/native_connectivity.py forward-api --execute

  native:setup:
    desc: Install the checksum-selected audited Windows gateway without PATH or trust writes
    cmds:
      - uv run --locked python -m scripts.native_gateway setup --execute

  native:doctor:
    desc: Report all native connectivity prerequisites without changing state
    cmds:
      - uv run --locked python -m scripts.native_gateway doctor --execute

  native:permissions:
    desc: Explicitly restrict gateway state permissions while retaining all files and CA keys
    prompt: Restrict .local/native-gateway to this account, SYSTEM and administrators? Review existing CA exposure and child ACLs first.
    cmds:
      - uv run --locked python -m scripts.native_gateway permissions --execute

  native:up:
    desc: Preflight and supervise three tunnels plus the HTTPS gateway in one foreground session
    cmds:
      - uv run --locked python -m scripts.native_gateway up --execute

  native:s3:
    desc: Forward the reviewed SeaweedFS Service to loopback for at most one hour
    cmds:
      - uv run --locked python scripts/native_connectivity.py forward-s3 --execute

  native:gateway:
    desc: Serve local HTTPS endpoints and the controlled search target without installing trust
    cmds:
      - uv run --locked python scripts/native_connectivity.py gateway --execute

  native:target:
    desc: Verify the selected image-backed target and forward its exact Pod to loopback
    cmds:
      - uv run --locked python scripts/native_connectivity.py forward-target --execute

  native:target-health:
    desc: Verify candidate registry access and owned ready resources without modifying them
    cmds:
      - uv run --locked python scripts/native_target_health.py --execute

  native:check:
    desc: Check trusted TLS, readiness, exact target bytes and anonymous storage denial
    cmds:
      - uv run --locked python scripts/native_connectivity.py check --execute --ca-file .local/native-gateway/caddy-data/pki/authorities/local/root.crt
