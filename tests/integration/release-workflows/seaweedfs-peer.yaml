# CI-only peer: no credentials/API token; fail on any generic transport failure.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: seaweedfs-proxy-peer-
  namespace: perf-platform
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: peer
          image: python:3.13.9-slim-trixie@sha256:326df678c20c78d465db501563f3492d17c42a4afe33a1f2bf5406a1d56b0e86
          command: [python, -c]
          args:
            - |
              import ipaddress, os, socket
              host = str(ipaddress.ip_address(os.environ['TARGET_IP']))
              with socket.create_connection((host, 8333), timeout=3):
                  pass
              for port in (9000, 19000, 9333, 19333, 8888, 18888, 8080, 18080):
                  try:
                      connection = socket.create_connection((host, port), timeout=3)
                  except ConnectionRefusedError:
                      continue
                  connection.close()
                  raise RuntimeError(f'Private listener was reachable: {port}')
              print('Selected proxy reachable; private listeners refused', flush=True)
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
