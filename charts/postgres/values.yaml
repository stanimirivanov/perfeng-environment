# Default values for the PostgreSQL Helm chart

replicaCount: 1

image:
  repository: postgres
  tag: 15-alpine
  pullPolicy: IfNotPresent

storage:
  size: 10Gi
  storageClassName: 'standard'

postgres:
  database: metadata
  user: test_user
  password: test_password # Override in production via secrets

resources:
  requests:
    memory: 512Mi
    cpu: 500m
  limits:
    memory: 1Gi
    cpu: 1000m

service:
  type: ClusterIP
  port: 5432

networkPolicy:
  enabled: true
  allowedNamespaces:
    - perfeng
    - monitoring

initScripts:
  enabled: true
  # scripts will be mounted from ConfigMap
