namespace: perf-platform

image:
  repository: minio/minio
  tag: latest
  pullPolicy: IfNotPresent

storage:
  size: 20Gi
  className: standard

credentials:
  user: perfeng
  password: perfeng123

nodeSelector:
  workload: control-plane

# Add tolerations for control-plane taint
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

probes:
  readiness:
    path: /minio/health/ready
    port: 9000
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /minio/health/live
    port: 9000
    initialDelaySeconds: 30
    periodSeconds: 15

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
