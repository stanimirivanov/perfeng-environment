{{- range .Values.namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    perfeng.io/component: {{ .component }}
    perfeng.io/purpose: {{ .purpose }}
    {{- include "perfeng-infra.labels" $ | nindent 4 }}
  annotations:
    description: {{ .description }}
{{- end }}