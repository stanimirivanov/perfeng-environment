  namespace: {{ .Values.roles.sutReader.namespace }}
  labels:
    perfeng.io/component: rbac
    {{- include "perfeng-infra.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.orchestrator.name }}
    namespace: {{ .Values.serviceAccounts.orchestrator.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.roles.sutReader.name }}
