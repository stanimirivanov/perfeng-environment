apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      annotations:
        checksum/proxy-config: {{ include (print $.Template.BasePath "/proxy.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: seaweedfs
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          # S3's gRPC API shares its bind address: keep the entire server private.
          command: [/bin/sh, -ec]
          args:
            - |
              test -s /run/s3-auth/s3.json
              mkdir -p /data/master /data/volumes
              exec /usr/bin/weed -logtostderr=true server \
                -ip=127.0.0.1 -ip.bind=127.0.0.1 \
                -dir=/data/volumes -master.dir=/data/master \
                -master.volumeSizeLimitMB=128 -volume.max=16 \
                -master.telemetry=false -filer=true -s3=true \
                -s3.ip.bind=127.0.0.1 -s3.port=9000 \
                -s3.config=/run/s3-auth/s3.json -s3.iam=false \
                -s3.port.iceberg=0 -s3.port.lance=0 \
                -s3.allowDeleteBucketNotEmpty=false -s3.autoCreateBucket=false
          workingDir: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec:
              command: [/bin/sh, -ec, 'netstat -lnt | grep -q "127.0.0.1:9000"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'netstat -lnt | grep -q "127.0.0.1:9000"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [/bin/sh, -ec, 'netstat -lnt | grep -q "127.0.0.1:9000"']
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            - {name: auth, mountPath: /run/s3-auth, readOnly: true}
        - name: s3-proxy
          image: {{ .Values.proxyImage | quote }}
          command: [haproxy, -f, /etc/haproxy/haproxy.cfg, -db]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: s3}
          livenessProbe:
            tcpSocket: {port: s3}
          volumeMounts:
            - {name: proxy-config, mountPath: /etc/haproxy, readOnly: true}
      volumes:
        - name: proxy-config
          configMap:
            name: {{ .Release.Name }}-proxy
        - name: tmp
          emptyDir: {}
        - name: auth
          secret:
            secretName: perfeng-s3-server-auth-v2
            defaultMode: 0440
            items:
              - {key: s3.json, path: s3.json}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: {{ .Values.storageSize | quote }}
