apiVersion: perfeng.dev/v1
kind: BrowserExecutionProfile
metadata:
  id: linux-four-core-4k
  version: 1.0.0
spec:
  virtualization: physical
  os:
    family: linux
    architecture: x64
    minimumBuild: 6
  cpu:
    minimumLogicalCores: 4
  memory:
    minimumTotalBytes: 17179869184
    minimumAvailableBytes: 8589934592
  gpu:
    hardwareAcceleration: true
  display:
    width: 3840
    height: 2160
    scaleFactor: 1
    refreshRateHz: 59
  power:
    source: ac
    plan: balanced
    batterySaver: false
  browser:
    name: chromium
    channel: chrome-for-testing
    headless: false
  calibration:
    maximumIdleCpuPercent: 10
    clockSynchronized: true
