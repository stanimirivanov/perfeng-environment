apiVersion: batch/v1
kind: Job
metadata:
  name: k6-test-{{TEST_NAME}}
  namespace: perf-generators
  labels:
    app: k6-test
    perfeng.io/component: test-runner
    perfeng.io/test: '{{TEST_NAME}}'
    perfeng.io/profile: '{{PROFILE}}'
spec:
  backoffLimit: 2
  activeDeadlineSeconds: { { TIMEOUT_SECONDS } }
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: k6-test
        perfeng.io/test: '{{TEST_NAME}}'
    spec:
      restartPolicy: Never
      serviceAccountName: perf-generator
      nodeSelector:
        workload: performance-generator
      tolerations:
        - key: workload
          value: performance-generator
          effect: NoSchedule
      initContainers:
        - name: copy-test-files
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /test-scripts/* /test-data/
          volumeMounts:
            - name: test-scripts
              mountPath: /test-scripts
            - name: test-data
              mountPath: /test-data
      containers:
        - name: k6
          image: perfeng-k6-tests:latest
          imagePullPolicy: IfNotPresent
          command:
            - k6
            - run
            - --config
            - '/test-data/{{WORKLOAD_CONFIG}}'
            - '/test-data/{{TEST_SCRIPT}}'
            - --out
            - 'json=/results/results.json'
          env:
            - name: BASE_URL
              value: '{{BASE_URL}}'
            - name: AUTH_TOKEN
              value: '{{AUTH_TOKEN}}'
            - name: PERF_RUN_ID
              value: '{{PERF_RUN_ID}}'
          volumeMounts:
            - name: test-data
              mountPath: /test-data
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: '{{CPU_REQUEST}}'
              memory: '{{MEMORY_REQUEST}}'
            limits:
              cpu: '{{CPU_LIMIT}}'
              memory: '{{MEMORY_LIMIT}}'
      volumes:
        - name: test-scripts
          configMap:
            name: k6-test-scripts-{{TEST_NAME}}
        - name: test-data
          emptyDir: {}
        - name: results
          emptyDir: {}
