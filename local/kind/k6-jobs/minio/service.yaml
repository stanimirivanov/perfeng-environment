apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: perf-platform
  labels:
    app: minio
    perfeng.io/component: storage
    perfeng.io/managed-by: perfeng
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
