---
# ResourceQuota for perf-platform namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: perf-platform-quota
  namespace: perf-platform
  labels:
    perfeng.io/component: quota
    perfeng.io/managed-by: perfeng
spec:
  hard:
    requests.cpu: '2'
    requests.memory: '4Gi'
    limits.cpu: '4'
    limits.memory: '8Gi'
    pods: '20'
    services: '10'
    configmaps: '20'
    secrets: '10'
    persistentvolumeclaims: '5'

---
# ResourceQuota for perf-generators namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: perf-generators-quota
  namespace: perf-generators
  labels:
    perfeng.io/component: quota
    perfeng.io/managed-by: perfeng
spec:
  hard:
    requests.cpu: '4'
    requests.memory: '8Gi'
    limits.cpu: '8'
    limits.memory: '16Gi'
    pods: '30'
    services: '5'
    configmaps: '30'
    secrets: '10'
    persistentvolumeclaims: '5'

---
# ResourceQuota for perf-sut namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: perf-sut-quota
  namespace: perf-sut
  labels:
    perfeng.io/component: quota
    perfeng.io/managed-by: perfeng
spec:
  hard:
    requests.cpu: '4'
    requests.memory: '8Gi'
    limits.cpu: '8'
    limits.memory: '16Gi'
    pods: '30'
    services: '20'
    configmaps: '30'
    secrets: '10'
    persistentvolumeclaims: '10'

---
# LimitRange for perf-generators namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: perf-generators-limits
  namespace: perf-generators
  labels:
    perfeng.io/component: limits
    perfeng.io/managed-by: perfeng
spec:
  limits:
    - type: Container
      default:
        cpu: '500m'
        memory: '512Mi'
      defaultRequest:
        cpu: '100m'
        memory: '128Mi'
      max:
        cpu: '2'
        memory: '2Gi'
      min:
        cpu: '50m'
        memory: '64Mi'
    - type: Pod
      max:
        cpu: '4'
        memory: '4Gi'
      min:
        cpu: '100m'
        memory: '128Mi'

---
# LimitRange for perf-sut namespace
apiVersion: v1
kind: LimitRange
metadata:
  name: perf-sut-limits
  namespace: perf-sut
  labels:
    perfeng.io/component: limits
    perfeng.io/managed-by: perfeng
spec:
  limits:
    - type: Container
      default:
        cpu: '500m'
        memory: '512Mi'
      defaultRequest:
        cpu: '100m'
        memory: '128Mi'
      max:
        cpu: '2'
        memory: '2Gi'
      min:
        cpu: '50m'
        memory: '64Mi'
    - type: Pod
      max:
        cpu: '4'
        memory: '4Gi'
      min:
        cpu: '100m'
        memory: '128Mi'
