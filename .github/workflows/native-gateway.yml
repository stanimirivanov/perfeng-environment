name: Build and optionally publish verified native gateway

on:
  pull_request:
    paths: [native-gateway/**, scripts/native_gateway*.py, scripts/native_connectivity.py, tests/test_native_gateway*.py, .github/workflows/native-gateway.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified main-only Linux gateway release
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  linux-serving:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: perfeng-environment
    steps:
      - uses: actions/checkout@v7
        with:
          path: perfeng-environment
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pinned control-plane source for schema qualification
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-control-plane
          ref: 2a74a20f69773fd9d43072e41668087612cdbf9e
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: perfeng-control-plane
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: perfeng-environment/.python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: perfeng-environment/native-gateway/build/go.mod
          cache-dependency-path: |
            perfeng-environment/native-gateway/build/go.sum
            perfeng-environment/native-gateway/audit/go.sum
      - run: uv sync --locked
      - name: Verify repository and real child ownership
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l native-gateway/build/main.go)"
          uv run --locked --offline ruff check .
          uv run --locked --offline python -m unittest discover -s tests -v
      - name: Build locked serving binary and audit its actual dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --offline python -m scripts.native_gateway_release build --output .local/gateway-package --revision "$GITHUB_SHA" --execute
          git diff --exit-code -- native-gateway/build native-gateway/audit
      - name: Exercise actual isolated Linux TLS startup and shutdown
        run: uv run --locked --offline python -m scripts.native_gateway_smoke --binary .local/gateway-package/caddy --execute
      - uses: actions/upload-artifact@v7
        with:
          name: verified-linux-gateway
          path: perfeng-environment/.local/gateway-package/
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: linux-serving
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-linux-gateway
          path: package
      - name: Publish only a new audited release and produce reviewable selection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod 700 package/caddy
          jq -e --arg sha "$GITHUB_SHA" '.sourceRevision == $sha and .audit.status == "passed" and .development == false and .platform == "linux/amd64"' package/build-record.json > /dev/null
          expected=$(jq -r .sha256 package/build-record.json)
          echo "$expected  package/caddy" | sha256sum --check
          tag="native-gateway-$GITHUB_SHA"
          gh release create "$tag" package/caddy package/build-record.json --target "$GITHUB_SHA" --title "Verified Linux Caddy" --notes 'Audited locked Linux build and isolated TLS/Host/URI and cleanup checks passed. This release does not select itself or install trust.'
          asset=$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.assets[] | select(.name == "caddy") | .id')
          jq --arg tag "$tag" --argjson asset "$asset" '{schemaVersion:1,platform:"linux/amd64",caddyVersion:.caddyVersion,goVersion:.goVersion,release:{tag:$tag,assetId:$asset,sha256:.sha256,sizeBytes:.sizeBytes,sourceRevision:.sourceRevision}}' package/build-record.json > release-selection.json
          printf 'Verified Linux gateway published. Review release-selection.json before explicit selection; no trust or cluster changes.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: gateway-release-selection
          path: release-selection.json
          retention-days: 30
