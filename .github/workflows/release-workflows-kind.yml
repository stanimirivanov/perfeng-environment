name: Staged release verifier kind integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-workflows-kind.yml
      - .argo-linux-amd64.sha256
      - Makefile
      - pyproject.toml
      - uv.lock
      - deployments/local-control-plane.json
      - deployments/local-infrastructure.json
      - deployments/maintenance-checkpoint-v1.schema.json
      - deployments/release-adoption-v1.schema.json
      - deployments/release-request-v1.schema.json
      - deployments/release-readiness-result-v1.schema.json
      - deployments/release-requests/**
      - gitops/release-workflows/**
      - gitops/release-workflows-bootstrap/maintenance-application-access.yaml
      - gitops/release-workflows-bootstrap/ledger-namespace.yaml
      - gitops/release-workflows-bootstrap/ledger-access.yaml
      - gitops/release-workflows-bootstrap/adoption-application-access.yaml
      - gitops/release-workflows-bootstrap/readiness-application-access.yaml
      - tests/fixtures/release-request-v1.json
      - tests/fixtures/release-readiness-observations.json
      - tests/fixtures/readiness-refused-workflow.json
      - tests/integration/release-workflows/**
      - tests/test_release_workflows_integration.py
      - tests/test_adoption_authority.py
      - tests/test_ledger_response_proxy.py
      - tests/test_readiness_http_fixture.py
      - tests/test_release_readiness.py
      - tests/test_release_adoption.py
      - tests/test_release_external_state.py
      - tests/release_verifier_support.py
      - charts/seaweedfs/values.yaml

permissions:
  contents: read

jobs:
  maintenance-verifier:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - name: Exercise release boundaries on ephemeral kind
        run: make release-workflows-integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain only non-secret fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-workflows-kind-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-workflows-results/
          if-no-files-found: ignore
          retention-days: 3
