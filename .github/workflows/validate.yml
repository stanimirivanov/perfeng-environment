name: Validate workspace tooling
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: perfeng-environment
          persist-credentials: false
          fetch-depth: 0
      - name: Check out pinned Kubernetes infrastructure
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/k8s-infrastructure
          ref: 5970bffa1f3d200e73d5a55e0cd4ef34ed9ef3b7
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: k8s-infrastructure
          persist-credentials: false
      - name: Check out pinned Kubernetes benchmark contracts
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-contracts
          ref: 3b86afa18b468d831c7c2c176618180db18b2764
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: perfeng-contracts
          persist-credentials: false
      - name: Check out pinned control-plane deployment source
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-k8s
          ref: b4499997cc4653f7a28bac7b242f8db421877f9a
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: perfeng-k8s
          persist-credentials: false
      - name: Check out pinned native target chart
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-k8s
          ref: a20633e150db4e940aba4355a32a7931b9a7f45a
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: perfeng-native-target-k8s
          persist-credentials: false
      - name: Check out pinned control-plane source
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-control-plane
          ref: 2a74a20f69773fd9d43072e41668087612cdbf9e
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: perfeng-control-plane
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: perfeng-environment/.python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
        working-directory: perfeng-environment
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --version=4.4.1 --no-progress --yes
      - name: Report toolchain
        run: make doctor
        working-directory: perfeng-environment
      - name: Run repository-local verification
        run: make verify
        working-directory: perfeng-environment
      - name: Install checksum-verified Caddy for offline gateway adaptation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content perfeng-environment/native-gateway/caddy-release.json -Raw | ConvertFrom-Json
          $platform = if ($IsWindows) { 'windows_amd64' } else { 'linux_amd64' }
          $extension = if ($IsWindows) { 'zip' } else { 'tar.gz' }
          $archive = Join-Path $env:RUNNER_TEMP "caddy.$extension"
          $destination = Join-Path $env:RUNNER_TEMP 'perfeng-caddy'
          Invoke-WebRequest "https://github.com/caddyserver/caddy/releases/download/v$($release.version)/caddy_$($release.version)_$platform.$extension" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $release.sha512.$platform) { throw 'Caddy release checksum mismatch' }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          if ($IsWindows) { Expand-Archive $archive -DestinationPath $destination } else { tar -xzf $archive -C $destination; if ($LASTEXITCODE -ne 0) { throw 'Caddy extraction failed' } }
          $destination | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Validate native gateway configuration without starting a server
        run: make native-gateway-check
        working-directory: perfeng-environment
      - name: Install Helm for offline rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          expected="$(tr -d '\r\n' < perfeng-environment/.helm-linux-amd64.sha256)"
          echo "${expected}  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Validate local Kubernetes manifests offline
        if: runner.os == 'Linux'
        run: make render-check
        working-directory: perfeng-environment
      - name: Install checksum-verified Argo Workflows CLI for offline lint
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location https://github.com/argoproj/argo-workflows/releases/download/v4.1.5/argo-linux-amd64.gz --output "$RUNNER_TEMP/argo.gz"
          expected="$(tr -d '\r\n' < perfeng-environment/.argo-linux-amd64.sha256)"
          echo "${expected}  $RUNNER_TEMP/argo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/argo.gz" > "$RUNNER_TEMP/argo"
          chmod +x "$RUNNER_TEMP/argo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint staged release WorkflowTemplate offline
        if: runner.os == 'Linux'
        run: make workflow-lint
        working-directory: perfeng-environment
      - name: Validate exact adjacent release selections
        if: runner.os == 'Linux'
        run: make release-selection-check
        env:
          NATIVE_TARGET_K8S_ROOT: ../perfeng-native-target-k8s
        working-directory: perfeng-environment

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Audit locked dependencies
        run: make supply-chain

  native-target-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - name: Build and verify candidate without publishing or deploying
        run: uv run --locked --offline python scripts/native_target.py build --image "perfeng-native-search:ci-${{ github.sha }}" --revision "${{ github.sha }}" --execute
