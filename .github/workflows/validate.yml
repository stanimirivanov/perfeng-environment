name: Validate workspace tooling
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: perfeng-environment
      - uses: actions/setup-python@v5
        with:
          python-version-file: perfeng-environment/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - run: uv sync --locked
        working-directory: perfeng-environment
      - run: uv run --locked ruff check .
        working-directory: perfeng-environment
      - run: uv run --locked ruff format --check .
        working-directory: perfeng-environment
      - run: uv run --locked ty check
        working-directory: perfeng-environment
      - run: uv run --locked python -m unittest discover -s tests -v
        working-directory: perfeng-environment
      - run: uv run --locked python scripts/workspace.py validate
        working-directory: perfeng-environment
