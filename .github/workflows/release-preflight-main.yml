name: Release parent composition on trusted main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-preflight-main.yml
      - .argo-linux-amd64.sha256
      - .helm-linux-amd64.sha256
      - pyproject.toml
      - uv.lock
      - deployments/**
      - gitops/release-workflows/**
      - tests/integration/release-workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-parent:
    if: github.ref == 'refs/heads/main' && github.repository == 'stanimirivanov/perfeng-environment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out selected server chart and runtime package
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-k8s
          ref: b4499997cc4653f7a28bac7b242f8db421877f9a
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: .ci/perfeng-k8s
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - name: Accept production release parents on an owned cluster
        run: make release-workflows-integration
        env:
          RELEASE_KIND_MODE: preflight-parent
          GITHUB_TOKEN: ${{ github.token }}
      - name: Retain only non-secret fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-preflight-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-workflows-results/
          if-no-files-found: ignore
          retention-days: 3
