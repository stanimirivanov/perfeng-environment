name: Release parent composition on trusted main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-preflight-main.yml
      - .argo-linux-amd64.sha256
      - .helm-linux-amd64.sha256
      - pyproject.toml
      - uv.lock
      - deployments/**
      - gitops/release-workflows/**
      - tests/integration/release-workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-parent:
    if: github.ref == 'refs/heads/main' && github.repository == 'stanimirivanov/perfeng-environment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adoption-scenario: [initial, receipt-only]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out selected server chart and runtime package
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/perfeng-k8s
          ref: b4499997cc4653f7a28bac7b242f8db421877f9a
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: .ci/perfeng-k8s
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Check out selected Argo CD bootstrap
        uses: actions/checkout@v7
        with:
          repository: stanimirivanov/k8s-infrastructure
          ref: 5970bffa1f3d200e73d5a55e0cd4ef34ed9ef3b7
          token: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
          path: .ci/k8s-infrastructure
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - name: Stage private Argo CD repository credential
        shell: bash
        env:
          ARGOCD_SOURCE_TOKEN: ${{ secrets.PERFENG_REPOSITORIES_CONTENTS_READ_TOKEN }}
        run: |
          set +x
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'perfeng-argocd-token'
          with path.open('x', encoding='utf-8') as stream:
              stream.write(os.environ['ARGOCD_SOURCE_TOKEN'])
          PY
      - name: Accept production release parents on an owned cluster
        run: make release-workflows-integration
        env:
          RELEASE_KIND_MODE: preflight-parent
          RELEASE_ADOPTION_SCENARIO: ${{ matrix.adoption-scenario }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Remove private Argo CD repository credential
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/perfeng-argocd-token"
      - name: Retain only non-secret fixture evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-preflight-main-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.adoption-scenario }}
          path: ${{ runner.temp }}/release-workflows-results/
          if-no-files-found: ignore
          retention-days: 3
