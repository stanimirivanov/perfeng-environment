name: Keycloak BFF consumer protocol
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
      - run: node --check tests/qualification/keycloak/bff-consumer.mjs
      - run: node --test --test-isolation=none tests/qualification/keycloak/bff-consumer.test.mjs
